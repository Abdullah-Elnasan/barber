services:
  postgres:
    image: postgres:16
    container_name: halak-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: halak
      POSTGRES_USER: halak
      POSTGRES_PASSWORD: halak_dev_password
    ports:
      - "5432:5432"
    volumes:
      - halak_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U halak -d halak"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: halak-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - halak_redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  halak_postgres_data:
  halak_redis_data: